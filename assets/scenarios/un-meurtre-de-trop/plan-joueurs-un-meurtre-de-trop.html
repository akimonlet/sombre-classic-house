</div></div><div id="room" aria-live="polite">Cliquez une pièce pour la sélectionner.</div><footer>Plan joueurs du manoir des Aulnes.</footer></main><script>
const levels=[...document.querySelectorAll('[data-floor]')];
function floor(n){levels.forEach(b=>{b.classList.toggle('on',b.dataset.floor===n);b.setAttribute('aria-pressed',String(b.dataset.floor===n));});document.querySelectorAll('.floor').forEach((p,i)=>p.hidden=String(i)!==n);document.querySelectorAll('.selected').forEach(r=>r.classList.remove('selected'));document.querySelector('#room').textContent='Cliquez une pièce pour la sélectionner.';}
levels.forEach(b=>b.onclick=()=>floor(b.dataset.floor));
function select(r){document.querySelectorAll('.room.selected').forEach(el=>el.classList.remove('selected'));r.classList.add('selected');document.querySelector('#room').textContent=r.getAttribute('aria-label');}
document.querySelectorAll('[data-room]').forEach(r=>{r.onclick=()=>select(r);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(r);}};});
document.querySelector('#print').onclick=()=>window.print();
</script></body></html>
