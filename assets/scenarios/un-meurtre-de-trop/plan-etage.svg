<svg xmlns="http://www.w3.org/2000/svg" class="manor-map" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="etage-title etage-desc" lang="fr">
  <title id="etage-title">Plan du manoir — premier étage</title>
  <desc id="etage-desc">Au nord à gauche, salle de bains ; au sud à gauche, bureau. Un palier central dessert les quatre pièces et contient au nord le même escalier qu'au rez-de-chaussée. À droite, chambre au nord et dressing au sud. Le nord est en haut.</desc>
  <style>
    .manor-map { background:#f6f1e5; color:#3b332e; }
    .manor-map .paper { fill:#f6f1e5; }
    .manor-map .room { cursor:pointer; outline:none; }
    .manor-map .hit { fill:transparent; stroke:none; pointer-events:all; transition:fill .15s; }
    .manor-map .room:hover .hit { fill:#b49d6630; }
    .manor-map .room:focus .hit, .manor-map .room:focus-visible .hit { fill:#a6834940; stroke:#94723f; stroke-width:3; stroke-dasharray:7 4; }
    .manor-map .room.selected .hit, .manor-map .room[aria-pressed="true"] .hit { fill:#9a783e45; }
    .manor-map .furniture { fill:none; stroke:#81847f; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
    .manor-map .soft { fill:#e9e5da; }
    .manor-map .fine { stroke-width:1; }
    .manor-map .wall { fill:none; stroke:#3b332e; stroke-width:10; stroke-linecap:butt; pointer-events:none; }
    .manor-map .outer { stroke-width:14; }
    .manor-map .opening { fill:none; stroke:#fffdf8; stroke-width:18; stroke-linecap:butt; }
    .manor-map .leaf { fill:none; stroke:#554d43; stroke-width:2; }
    .manor-map .swing { fill:none; stroke:#9d978b; stroke-width:1.3; }
    .manor-map .window { pointer-events:none; }
    .manor-map .glazing { fill:none; stroke:#85999b; stroke-width:1.8; }
    .manor-map .label { font-family:Georgia,'Times New Roman',serif; font-size:23px; fill:#332d28; text-anchor:middle; pointer-events:none; }
    .manor-map .small { font-family:Arial,sans-serif; font-size:15px; letter-spacing:1px; fill:#70695e; pointer-events:none; }
    .manor-map .level { font-family:Arial,sans-serif; font-size:18px; font-weight:bold; letter-spacing:2px; fill:#3b332e; }
    .manor-map .architecture { pointer-events:none; }
  </style>
